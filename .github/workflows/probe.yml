name: probe
on:
  push:
    branches: [probe-argenprop]
    paths: ["probe/fetch.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt requests
      - run: python probe/fetch.py | tee probe/log.txt
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - if: always()
        run: |
          git config user.name probe-bot; git config user.email probe@users.noreply.github.com
          git add probe && git commit -m "probe pages" && git push
