name: hunt

on:
  schedule:
    - cron: "17 11,17,23 * * *"   # 08:17, 14:17 and 20:17 Buenos Aires time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/app.html", "hh/**", "run.py", "build.py"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape, analyse and score
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "push" ]; then python -u run.py --no-scrape; else python -u run.py; fi 2>&1 | tee data/last_run.log
      - run: python build.py
      - name: Commit data
        run: |
          git config user.name "house-hunter-bot"
          git config user.email "house-hunter-bot@users.noreply.github.com"
          git add data web/listings.json web/index.html
          git diff --cached --quiet || git commit -m "hunt: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
