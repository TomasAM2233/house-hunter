name: hunt

on:
  schedule:
    - cron: "17 11,17,23 * * *"   # full runs: 08:17, 14:17 and 20:17 Buenos Aires time
    - cron: "47 10-23,0-2 * * *"  # quick runs: newest Zonaprop/Argenprop listings every hour, 07:47 to 23:47
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["hh/**", "run.py"]   # app-only changes are published by site.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scrape, analyse and score
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "push" ]; then ARGS="--no-scrape"
          elif [ "${{ github.event.schedule }}" = "47 10-23,0-2 * * *" ]; then ARGS="--quick"
          else ARGS=""; fi
          python -u run.py $ARGS 2>&1 | tee data/last_run.txt
      - run: python build.py
      - name: Commit data
        if: always()
        run: |
          git config user.name "house-hunter-bot"
          git config user.email "house-hunter-bot@users.noreply.github.com"
          git add data web geo
          git diff --cached --quiet && exit 0
          git commit -qm "hunt: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git push -q && exit 0
            # someone pushed meanwhile (code, tags saved from the app, an "Evaluar con IA" result): take main as it
            # is and lay this run's outputs on top. Never rebase: a text merge of two listings.json versions
            # leaves the same listing in it twice (seen 2026-10-31, one copy with the old price).
            git fetch -q origin main
            OUT="data/listings.json data/ai_cache.json data/ai_final.json data/geocode_cache.json data/last_run.txt data/ai_pending web/listings.json geo/parks.json"
            mkdir -p /tmp/out && cp -r --parents $OUT /tmp/out/ 2>/dev/null || true
            git reset -q --hard origin/main
            python merge_ai.py /tmp/out   # keep reads made meanwhile from the app ("Evaluar con IA")
            rm -f /tmp/out/data/ai_cache.json /tmp/out/data/ai_final.json
            cp -r /tmp/out/. . && python build.py && git add data web geo
            git commit -qm "hunt: $(date -u +%Y-%m-%dT%H:%MZ)"
          done
          exit 1
      - name: Add map key to the deployed page
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
