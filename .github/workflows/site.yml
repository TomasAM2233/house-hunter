name: site

# Publish the web app as it is on main, without scraping. Runs on its own so a long hunt run doesn't hold it up.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["web/app.html", "build.py"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow requests
      - run: python build.py
        env:
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      # deploy-pages sometimes looks for the artifact a split second after the upload and finds none ("No artifacts
      # named github-pages were found", hunt #159, 2026-11-10). It's GitHub catching up, so wait and try once more.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
