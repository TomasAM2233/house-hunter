<title>House Hunter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#6a46b8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Mobile first: one column of photo cards, a full-screen sheet for the open house.
   From 1000px up the sheet becomes a sticky panel beside the list. */
:root {
  --bg: #f6f5f8;
  --surface: #ffffff;
  --sunk: #eeecf2;
  --line: #dcd8e3;
  --fg: #1d1a24;
  --muted: #6b6578;
  --accent: #6a46b8;        /* jacarandá */
  --accent-soft: #ece6f8;
  --on-accent: #ffffff;
  --good: #1f7a4d;
  --warn: #a76a00;
  --bad: #b3322d;
  --good-soft: #e3f2ea;
  --warn-soft: #f8eed9;
  --bad-soft: #f8e3e1;
  --maipu: #c9a227;
  --scrim: rgb(20 16 28 / .55);
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15131a; --surface: #1e1b25; --sunk: #26222f; --line: #363143; --fg: #ece9f2; --muted: #a39cb2;
  --accent: #b39af0; --accent-soft: #2e2645; --on-accent: #15131a; --good: #5fcf96; --warn: #e6b24a; --bad: #f07a72;
  --good-soft: #1b3328; --warn-soft: #3a2f17; --bad-soft: #3d201e; --maipu: #e2c157; --scrim: rgb(0 0 0 / .6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15131a; --surface: #1e1b25; --sunk: #26222f; --line: #363143; --fg: #ece9f2; --muted: #a39cb2;
  --accent: #b39af0; --accent-soft: #2e2645; --on-accent: #15131a; --good: #5fcf96; --warn: #e6b24a; --bad: #f07a72;
  --good-soft: #1b3328; --warn-soft: #3a2f17; --bad-soft: #3d201e; --maipu: #e2c157; --scrim: rgb(0 0 0 / .6); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
body.locked { overflow: hidden; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── top bar ── */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 10px 8px; display: flex; flex-direction: column; gap: 8px; }
.bar .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; flex: 1; min-width: 0; }
.bar h1 small { display: block; font: 400 12px/1.3 var(--font-body); color: var(--muted); letter-spacing: 0; }
.icon { border: 1px solid var(--line); background: var(--surface); height: 38px; min-width: 38px; padding: 0 10px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-size: 14px; color: var(--fg); white-space: nowrap; }
.icon[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.dot.err { background: var(--bad); }
.tabs { display: flex; background: var(--sunk); border-radius: 10px; padding: 3px; }
.tabs button { flex: 1; border: 0; background: transparent; padding: 7px 4px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 14px; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.tabs .n { font: 500 12px var(--font-data); opacity: .8; margin-left: 3px; }
.tools { display: flex; gap: 8px; }
.tools input, .tools select { height: 38px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; min-width: 0; }
.tools input { flex: 1 1 auto; }
.tools select { flex: 0 0 auto; max-width: 44%; }

/* ── info panel (sources + how we score) ── */
.info { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 14px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.info p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 65ch; }
.status { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.err { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.wbar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; gap: 2px; margin-top: 6px; }
.wlegend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.wlegend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }

/* ── map ── */
.map { margin: 12px var(--gutter-r) 0 var(--gutter-l); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
.map svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
.map .cap { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); padding: 4px 6px 2px; }

/* ── list ── */
.layout { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 12px calc(32px + env(safe-area-inset-bottom, 0px)); }
.list { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; width: 100%; padding: 0; }
.card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ph { position: relative; aspect-ratio: 16 / 10; max-width: 100%; background: var(--sunk); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .badge { position: absolute; top: 10px; right: 10px; }
.ph .tl { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; flex-wrap: wrap; max-width: 70%; }
.ph .tl .pill { background: rgb(20 16 28 / .72); color: #fff; backdrop-filter: blur(4px); }
.ph .rank { position: absolute; bottom: 10px; left: 10px; font: 500 12px var(--font-data); color: #fff; background: rgb(20 16 28 / .72); padding: 1px 8px; border-radius: 999px; }
.cbody { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cprice { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cprice b { font: 600 21px/1.2 var(--font-display); }
.cprice span { color: var(--muted); font-size: 13px; }
.specs { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13.5px; color: var(--muted); }
.specs b { color: var(--fg); font-weight: 600; }
.brief { margin: 0; font-size: 14.5px; line-height: 1.45; }
.brief.none { color: var(--muted); font-size: 13.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips .pill { font-size: 11.5px; }
.mini { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--sunk); gap: 1px; }
.badge { font: 700 20px/1 var(--font-display); width: 50px; height: 50px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.badge.hi { background: var(--good-soft); color: var(--good); }
.badge.mid { background: var(--warn-soft); color: var(--warn); }
.badge.lo { background: var(--bad-soft); color: var(--bad); }
.badge.out { background: var(--sunk); color: var(--muted); font-size: 16px; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.more { align-self: center; }

/* ── detail sheet ── */
.detail { position: fixed; inset: 0; z-index: 20; background: var(--surface); overflow-y: auto; overscroll-behavior: contain; }
.detail[hidden] { display: none; }
.dtop { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px;
  padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.dtop .t { flex: 1; min-width: 0; }
.dtop .t b { display: block; font: 600 17px/1.2 var(--font-display); }
.dtop .t span { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dtop .badge { width: 42px; height: 42px; font-size: 17px; border-radius: 10px; }
.gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 2px; background: var(--sunk); scrollbar-width: none; }
.gallery::-webkit-scrollbar { display: none; }
.gallery img { flex: 0 0 100%; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; object-fit: cover; scroll-snap-align: center; display: block; }
.gcount { font: 500 12px var(--font-data); color: var(--muted); text-align: right; padding: 4px var(--gutter-r) 0 var(--gutter-l); }
.dbody { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 12px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
.dbody h2 { font-size: 20px; }
.addr { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.lead { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
.lead p { margin: 4px 0 0; font-size: 15.5px; line-height: 1.45; }
.lead .label { color: var(--accent); }
.discard { background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--sunk); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.fact span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.fact b { font: 500 15px var(--font-data); }
.actions { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); min-height: 44px; padding: 0 14px; border-radius: 12px; cursor: pointer; text-decoration: none; color: var(--fg); font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.section { display: flex; flex-direction: column; gap: 8px; }
.ai { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.ai p { margin: 0; }
.ai ul { margin: 0; padding-left: 18px; }
.ai .num { font-size: 13px; color: var(--muted); }
.breakdown { display: grid; grid-template-columns: 96px minmax(0, 1fr) 50px; gap: 6px 10px; align-items: center; font-size: 13.5px; }
.breakdown .bar { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.breakdown .bar i { display: block; height: 100%; border-radius: 4px; }
.breakdown .why { grid-column: 1 / 4; color: var(--muted); font-size: 12.5px; margin: -2px 0 4px; }
.breakdown .pts { text-align: right; }
.desc { white-space: pre-line; color: var(--muted); font-size: 13.5px; }
.desc.clamp { max-height: 9.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 14px; align-self: start; }
footer { color: var(--muted); font-size: 12px; max-width: 70ch; margin-top: 24px; }

@media (min-width: 640px) {
  .list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (min-width: 1000px) {
  .bar { flex-direction: row; align-items: center; flex-wrap: wrap; }
  .bar .row:first-child { flex: 1 1 240px; }
  .tabs { flex: 0 1 460px; }
  .tools { flex: 1 1 360px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 20px; align-items: start; max-width: 1400px; margin: 0 auto; }
  .list { grid-template-columns: minmax(0, 1fr); }
  .card { flex-direction: row; }
  .card .ph { flex: 0 0 38%; aspect-ratio: auto; min-height: 170px; }
  .detail, .detail[hidden] { display: block !important; position: sticky; inset: auto; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 92px);
    border: 1px solid var(--line); border-radius: 14px; z-index: 1; }
  .dtop { padding-top: 10px; }
  .dtop .close { display: none; }
  .gallery img { aspect-ratio: auto; height: 340px; }
  .map { max-width: 1400px; margin-left: max(var(--gutter-l), calc((100% - 1400px) / 2)); margin-right: max(var(--gutter-r), calc((100% - 1400px) / 2)); }
}
@media (prefers-reduced-motion: no-preference) { .gallery { scroll-behavior: smooth; } }
</style>

<header class="bar">
  <div class="row">
    <h1>House Hunter <small id="sub">cargando…</small></h1>
    <button class="icon" id="mapbtn" aria-pressed="false" aria-label="Mostrar mapa">Mapa</button>
    <button class="icon" id="infobtn" aria-pressed="false" aria-label="Fuentes y puntaje"><span class="dot" id="dot"></span>Info</button>
  </div>
  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" data-v="short" aria-selected="true">Candidatas</button>
    <button role="tab" data-v="fav" aria-selected="false">★</button>
    <button role="tab" data-v="out" aria-selected="false">Descartadas</button>
    <button role="tab" data-v="all" aria-selected="false">Todas</button>
  </div>
  <div class="tools">
    <input id="q" type="search" placeholder="Calle, palabra…" aria-label="Buscar" enterkeyhint="search">
    <select id="sort" aria-label="Ordenar">
      <option value="score">Mejor puntaje</option>
      <option value="price">Menor precio</option>
      <option value="ppm2">Menor USD/m²</option>
      <option value="m2">Más m²</option>
      <option value="new">Más nuevas</option>
    </select>
  </div>
</header>

<section class="info" id="info" hidden></section>
<div class="map" id="map" hidden></div>

<main class="layout">
  <div>
    <div class="list" id="list"></div>
    <footer id="foot"></footer>
  </div>
  <article class="detail" id="detail" hidden aria-label="Detalle"></article>
</main>

<script type="application/json" id="hh-data">__HH_DATA__</script>
<script>
const LABELS = { price: "Precio", space: "Espacio", location: "Ubicación", condition: "Estado", patio: "Patio",
  vertical: "Crecer arriba", credit: "Apto crédito", garage: "Cochera", quiet: "Tranquilidad", light: "Luz" };
const COLORS = { price: "#6a46b8", space: "#8e6fd1", location: "#2e7fa8", condition: "#1f8a6a", patio: "#4fa35a",
  vertical: "#93a83a", credit: "#c9a227", garage: "#c47a2c", quiet: "#a8577e", light: "#d6b56b" };
const SRC = { zonaprop: "Zonaprop", mercadolibre: "Mercado Libre", argenprop: "Argenprop", tokko: "Inmobiliarias" };
const PATIO = { none: "sin patio", small: "patio chico", medium: "patio mediano", large: "patio grande" };
const PAGE = 30;
const srcName = l => l.source === "tokko" ? (l.publisher || "Inmobiliaria") : (SRC[l.source] || l.source);
const $ = s => document.querySelector(s);
const usd = n => n == null ? "?" : "USD " + Math.round(n).toLocaleString("es-AR");
const k$ = n => n == null ? "?" : "USD " + Math.round(n / 1000) + "k";
const fmt = n => n == null ? "?" : (Math.round(n * 10) / 10).toLocaleString("es-AR");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const wide = matchMedia("(min-width: 1000px)");
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let DATA, view = "short", sel = null, shown = PAGE, favs = new Set(store.get("hh-favs", []));

function band(s, l) { if (l.discard?.length) return "out"; return s >= 62 ? "hi" : s >= 50 ? "mid" : "lo"; }
function img(l, i) { return (l.thumbs && l.thumbs[i]) || (l.photos && l.photos[i]) || null; }
function ppm2(l) { return l.price_usd && l.total_m2 ? Math.round(l.price_usd / l.total_m2) : null; }
const brief = l => l.ai?.brief || l.ai?.summary || "";

function base() {
  const act = DATA.listings.filter(l => l.active !== false);
  return { short: act.filter(l => !l.discard.length), out: act.filter(l => l.discard.length), all: act, fav: DATA.listings.filter(l => favs.has(l.id)) };
}
function rows() {
  let r = base()[view];
  const q = $("#q").value.trim().toLowerCase();
  if (q) r = r.filter(l => (l.title + " " + l.address + " " + l.description + " " + brief(l)).toLowerCase().includes(q));
  const key = { score: l => -l.score, price: l => l.price_usd ?? 1e9, ppm2: l => ppm2(l) ?? 1e9,
    m2: l => -(l.total_m2 ?? 0), new: l => -(Date.parse(l.first_seen) || 0) }[$("#sort").value];
  return r.slice().sort((a, b) => key(a) - key(b));
}

function miniBar(l) {
  return `<div class="mini" title="Aporte de cada criterio">${Object.entries(l.components).map(([k, c]) =>
    `<i style="width:${c.points}%;background:${COLORS[k]}"></i>`).join("")}</div>`;
}

function specs(l) {
  const g = l.geo;
  return `<div class="specs">
    <span><b class="num">${fmt(l.total_m2)}</b> m² tot</span>
    <span><b class="num">${fmt(l.ambientes)}</b> amb</span>
    ${g ? `<span><b class="num">${fmt(g.maipu_blocks)}</b> cdas Maipú</span><span>tren <b class="num">${fmt(g.station.blocks)}</b></span>` : ""}
    ${l.ai?.patio ? `<span>${PATIO[l.ai.patio] || esc(l.ai.patio)}</span>` : ""}
  </div>`;
}

function card(l, i) {
  const b = band(l.score, l), src = img(l, 0);
  const chips = (l.flags || []).filter(f => f !== "sin análisis IA").map(f => `<span class="pill warn">${esc(f)}</span>`)
    .concat(l.discard.length ? [`<span class="pill err">${esc(l.discard[0])}</span>`] : []);
  const text = brief(l);
  return `<button class="card" data-id="${l.id}" aria-current="${sel === l.id}">
    <div class="ph">
      ${src ? `<img loading="lazy" decoding="async" src="${esc(src)}" alt="">` : ""}
      <div class="tl"><span class="pill">${l.type === "ph" ? "PH" : "Casa"}</span><span class="pill">${esc(srcName(l))}</span>${favs.has(l.id) ? `<span class="pill">★</span>` : ""}</div>
      <span class="badge ${b}">${l.discard.length ? "—" : Math.round(l.score)}</span>
      <span class="rank">#${i + 1} · ${esc(l.zone || "")}</span>
    </div>
    <div class="cbody">
      <div class="cprice"><b class="num">${usd(l.price_usd)}</b><span class="num">${ppm2(l) ? ppm2(l).toLocaleString("es-AR") + " USD/m²" : ""}</span></div>
      ${specs(l)}
      ${text ? `<p class="brief">${esc(text)}</p>` : `<p class="brief none">${l.discard.length ? "" : "Todavía sin lectura de fotos: el puntaje sale solo del aviso."}</p>`}
      ${miniBar(l)}
      ${chips.length ? `<div class="chips">${chips.join("")}</div>` : ""}
    </div>
  </button>`;
}

function renderList() {
  const r = rows();
  const counts = base();
  document.querySelectorAll("#tabs button").forEach(b => {
    const n = counts[b.dataset.v].length;
    b.innerHTML = `${b.dataset.v === "fav" ? "★" : { short: "Candidatas", out: "Descartadas", all: "Todas" }[b.dataset.v]}<span class="n">${n}</span>`;
  });
  $("#list").innerHTML = r.length
    ? r.slice(0, shown).map(card).join("") + (r.length > shown ? `<button class="btn more" id="more">Ver ${Math.min(PAGE, r.length - shown)} más de ${r.length - shown}</button>` : "")
    : `<div class="empty">${view === "fav" ? "Tocá ★ en una casa para guardarla acá." : "Nada con estos filtros."}</div>`;
  const m = $("#more"); if (m) m.onclick = e => { e.stopPropagation(); shown += PAGE; renderList(); };
  if (wide.matches && r.length && !r.some(l => l.id === sel)) select(r[0].id, false);
}

function select(id, push = true) {
  sel = id;
  const l = DATA.listings.find(x => x.id === id);
  document.querySelectorAll(".card").forEach(c => c.setAttribute("aria-current", c.dataset.id === id));
  renderDetail(l);
  if (!$("#map").hidden) renderMap();
  if (!wide.matches) {
    $("#detail").hidden = false;
    $("#detail").scrollTop = 0;
    document.body.classList.add("locked");
    if (push) try { history.pushState({ open: id }, ""); } catch {}
  }
}
function closeDetail() {
  $("#detail").hidden = true;
  document.body.classList.remove("locked");
}

function renderDetail(l) {
  if (!l) { $("#detail").innerHTML = ""; return; }
  const pics = (l.photos?.length ? l.photos : l.thumbs || []).slice(0, 12);
  const a = l.ai, g = l.geo;
  const comp = Object.entries(l.components).map(([k, c]) => `
    <span>${LABELS[k]}</span>
    <span class="bar"><i style="width:${c.value * 100}%;background:${COLORS[k]}"></i></span>
    <span class="pts num">${fmt(c.points)}/${c.max}</span>
    <span class="why">${esc(c.why)}</span>`).join("");
  const aiBox = a ? `<div class="section ai">
      <span class="label">Lectura de fotos</span>
      <p class="num">Estado ${a.condition}/5 · reforma ~${usd(a.reform_usd)} · ${PATIO[a.patio] || esc(a.patio)}${a.patio_m2_est ? ` ~${a.patio_m2_est} m²` : ""} · luz ${a.natural_light}/5 · tranquilidad ${a.quiet}/5</p>
      ${a.reform_notes ? `<p>${esc(a.reform_notes)}</p>` : ""}
      ${a.highlights?.length ? `<ul>${a.highlights.map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
      ${a.red_flags?.length ? `<ul style="color:var(--bad)">${a.red_flags.map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
    </div>` : "";
  const hist = (l.price_history || []).length > 1 ? `<div class="section"><span class="label">Historial de precio</span><div class="num" style="font-size:13.5px">${l.price_history.map(([d, p]) => `${d}: ${usd(p)}`).join(" → ")}</div></div>` : "";
  const text = brief(l);
  $("#detail").innerHTML = `
    <div class="dtop">
      <button class="icon close" id="back" aria-label="Volver a la lista">←</button>
      <div class="t"><b class="num">${usd(l.price_usd)}</b><span>${esc(l.zone || "")} · ${l.type === "ph" ? "PH" : "Casa"} · ${esc(srcName(l))}</span></div>
      <button class="icon" id="fav" aria-pressed="${favs.has(l.id)}" aria-label="Favorita">★</button>
      <span class="badge ${band(l.score, l)}">${l.discard.length ? "—" : Math.round(l.score)}</span>
    </div>
    ${pics.length ? `<div class="gallery" id="gal">${pics.map((p, i) => `<img ${i ? 'loading="lazy"' : ""} src="${esc(p)}" alt="Foto ${i + 1}">`).join("")}</div><div class="gcount num" id="gcount">1 / ${pics.length}</div>` : ""}
    <div class="dbody">
      <div><h2>${esc(l.title)}</h2><div class="addr">${esc(l.address)} · visto desde ${esc(l.first_seen)}</div></div>
      ${l.discard.length ? `<div class="discard"><b>Descartada:</b> ${l.discard.map(esc).join(" · ")}</div>` : ""}
      ${text ? `<div class="lead"><span class="label">Resumen para vos</span><p>${esc(text)}</p></div>` : ""}
      <div class="facts">
        <div class="fact"><span>USD/m² tot</span><b>${fmt(ppm2(l))}</b></div>
        <div class="fact"><span>Total</span><b>${fmt(l.total_m2)} m²</b></div>
        <div class="fact"><span>Cubierta</span><b>${fmt(l.covered_m2)} m²</b></div>
        <div class="fact"><span>Ambientes</span><b>${fmt(l.ambientes)}</b></div>
        <div class="fact"><span>A Maipú</span><b>${g ? fmt(g.maipu_blocks) + " cdas" : "?"}</b></div>
        <div class="fact"><span>${g ? esc(g.station.name) : "Tren"}</span><b>${g ? fmt(g.station.blocks) + " cdas" : "?"}</b></div>
        <div class="fact"><span>Cochera</span><b>${l.garage ? fmt(l.garage) : "no"}</b></div>
        <div class="fact"><span>Antigüedad</span><b>${l.age_years != null ? fmt(l.age_years) + " años" : "?"}</b></div>
      </div>
      <div class="actions">
        <a class="btn primary" href="${esc(l.url)}" target="_blank" rel="noopener">Ver aviso en ${esc(srcName(l))} ↗</a>
        <a class="btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.lat ? l.lat + "," + l.lng : l.address + ", Vicente López")}" target="_blank" rel="noopener">Mapa ↗</a>
      </div>
      ${aiBox}
      <div class="section"><span class="label">Por qué ${fmt(l.score)} / 100</span><div class="breakdown">${comp}</div></div>
      ${hist}
      <div class="section"><span class="label">Descripción del aviso</span><div class="desc clamp" id="desc">${esc(l.description)}</div>
        <button class="linkish" id="descmore">Leer todo</button></div>
    </div>`;
  $("#back").onclick = () => history.state?.open ? history.back() : closeDetail();
  $("#fav").onclick = () => {
    favs.has(l.id) ? favs.delete(l.id) : favs.add(l.id);
    store.set("hh-favs", [...favs]);
    $("#fav").setAttribute("aria-pressed", favs.has(l.id));
    renderList();
  };
  $("#descmore").onclick = e => { $("#desc").classList.remove("clamp"); e.target.remove(); };
  const gal = $("#gal");
  if (gal) gal.onscroll = () => { $("#gcount").textContent = `${Math.round(gal.scrollLeft / gal.clientWidth) + 1} / ${pics.length}`; };
}

function renderMap() {
  const ref = DATA.reference; if (!ref) { $("#mapbtn").hidden = true; return; }
  // fit the frame to the houses on screen (plus a margin), so the dots don't huddle in a corner
  const ll = rows().filter(l => l.lat).map(l => [l.lat, l.lng]).concat([ref.puente]);
  const lats = ll.map(p => p[0]), lons = ll.map(p => p[1]), pad = 0.004;
  const b = { s: Math.min(...lats) - pad, n: Math.max(...lats) + pad, w: Math.min(...lons) - pad, e: Math.max(...lons) + pad };
  const k = Math.cos(34.52 * Math.PI / 180);
  const W = 640, H = Math.round(Math.min(560, Math.max(300, W * (b.n - b.s) / ((b.e - b.w) * k))));
  const s = Math.min(W / ((b.e - b.w) * k), H / (b.n - b.s));
  const ox = (W - (b.e - b.w) * k * s) / 2, oy = (H - (b.n - b.s) * s) / 2;
  const P = (lat, lon) => [ox + (lon - b.w) * k * s, oy + (b.n - lat) * s];
  const line = ref.maipu.map(w => `<polyline points="${w.map(p => P(...p).map(v => v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(--maipu)" stroke-width="3" stroke-linecap="round"/>`).join("");
  const st = Object.entries(ref.stations).map(([n, [la, lo]]) => { const [x, y] = P(la, lo);
    return `<g><rect x="${x - 4}" y="${y - 4}" width="8" height="8" fill="var(--surface)" stroke="var(--fg)" stroke-width="1.5"/><text x="${x + 7}" y="${y + 4}" font-size="11" fill="var(--muted)">${esc(n)}</text></g>`; }).join("");
  const [px, py] = P(...ref.puente);
  const pts = rows().filter(l => l.lat).map(l => { const [x, y] = P(l.lat, l.lng);
    const c = l.discard.length ? "var(--muted)" : { hi: "var(--good)", mid: "var(--warn)", lo: "var(--bad)" }[band(l.score, l)];
    const on = l.id === sel;
    return `<circle data-id="${l.id}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${on ? 10 : 7}" fill="${c}" fill-opacity="${l.discard.length ? .35 : .85}" stroke="${on ? "var(--fg)" : "var(--surface)"}" stroke-width="${on ? 2.5 : 1.2}" style="cursor:pointer"><title>${esc(l.address)} · ${Math.round(l.score)}</title></circle>`; });
  $("#map").innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de la zona con Av. Maipú, estaciones y casas">
    <rect width="${W}" height="${H}" fill="var(--sunk)" rx="8"/>
    ${line}${st}
    <g><circle cx="${px}" cy="${py}" r="5" fill="var(--bad)"/><text x="${px + 8}" y="${py + 4}" font-size="11" fill="var(--bad)">Puente Saavedra</text></g>
    ${pts.join("")}
    <text x="10" y="${H - 10}" font-size="11" fill="var(--muted)">↑ Río al noreste · 1 cdra ≈ 100 m</text>
  </svg>
  <div class="cap"><span><i style="display:inline-block;width:14px;height:3px;background:var(--maipu);vertical-align:middle"></i> Maipú</span><span>□ estación</span><span style="color:var(--good)">● 62+</span><span style="color:var(--warn)">● 50–61</span><span style="color:var(--bad)">● &lt;50</span><span>● descartada</span></div>`;
  $("#map").querySelectorAll("circle[data-id]").forEach(c => c.onclick = () => select(c.dataset.id));
}

function renderInfo() {
  const S = DATA.search, bad = Object.values(DATA.status || {}).some(s => !s.ok);
  $("#dot").classList.toggle("err", bad);
  $("#sub").textContent = `Actualizado ${DATA.generated_at}`;
  $("#info").innerHTML = `
    <p>Casas y PH en ${S.zones.join(", ")} · USD ${S.price_min / 1000}k–${S.price_max / 1000}k · ${S.ppm2_min}–${S.ppm2_max} USD/m² · ${S.min_ambientes}+ amb · ${S.min_total_m2}+ m² · patio obligatorio · 3 a 15 cuadras de Maipú.</p>
    <div><span class="label">Fuentes</span><div class="status" style="margin-top:6px">${Object.entries(DATA.status || {}).map(([k, s]) =>
      `<span class="pill ${s.ok ? "ok" : "err"}" title="${esc(s.error || "")}">${SRC[k] || k}: ${s.ok ? s.count + " · " + esc(s.at.slice(5)) : "falló " + esc(s.at.slice(5))}</span>`).join("")}</div></div>
    <div><span class="label">Cómo puntuamos (sobre 100)</span>
      <div class="wbar">${Object.entries(DATA.weights).map(([k, w]) => `<i style="flex:${w};background:${COLORS[k]}"></i>`).join("")}</div>
      <div class="wlegend">${Object.entries(DATA.weights).map(([k, w]) => `<span><i style="background:${COLORS[k]}"></i>${LABELS[k]} ${w}</span>`).join("")}</div></div>`;
  $("#foot").textContent = "Descartadas = no cumplen algún filtro duro. La IA mira las fotos solo de las mejores candidatas y escribe el resumen. Las favoritas se guardan en este navegador.";
}

function boot(d) {
  DATA = d;
  renderInfo(); renderList();
  $("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return;
    view = b.dataset.v; shown = PAGE; document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
    renderList(); if (!$("#map").hidden) renderMap(); window.scrollTo({ top: 0 }); };
  $("#sort").onchange = () => { shown = PAGE; renderList(); };
  $("#q").oninput = () => { shown = PAGE; renderList(); if (!$("#map").hidden) renderMap(); };
  $("#list").onclick = e => { const c = e.target.closest(".card"); if (c) select(c.dataset.id); };
  const toggle = (btn, el, after) => $(btn).onclick = () => { const on = el.hidden; el.hidden = !on; $(btn).setAttribute("aria-pressed", on); if (on && after) after(); };
  toggle("#mapbtn", $("#map"), renderMap);
  toggle("#infobtn", $("#info"));
  addEventListener("popstate", () => { if (!wide.matches) closeDetail(); });
  wide.addEventListener?.("change", () => { closeDetail(); renderList(); if (wide.matches && sel) renderDetail(DATA.listings.find(x => x.id === sel)); });
}

const inline = $("#hh-data").textContent.trim();
if (inline && !inline.startsWith("__")) boot(JSON.parse(inline));
else fetch("listings.json").then(r => r.json()).then(boot).catch(() => { $("#list").innerHTML = `<div class="empty">No pude cargar listings.json.</div>`; });
</script>
