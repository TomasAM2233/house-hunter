<title>House Hunter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#6a46b8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Mobile first: one column of photo cards, a full-screen sheet for the open house.
   From 1000px up the sheet becomes a sticky panel beside the list. */
:root {
  --bg: #f6f5f8;
  --surface: #ffffff;
  --sunk: #eeecf2;
  --line: #dcd8e3;
  --fg: #1d1a24;
  --muted: #6b6578;
  --accent: #6a46b8;        /* jacarandá */
  --accent-soft: #ece6f8;
  --on-accent: #ffffff;
  --good: #1f7a4d;
  --warn: #a76a00;
  --bad: #b3322d;
  --good-soft: #e3f2ea;
  --warn-soft: #f8eed9;
  --bad-soft: #f8e3e1;
  --maipu: #c9a227;
  --scrim: rgb(20 16 28 / .55);
  --font-display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", "Helvetica Neue", Arial, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #15131a; --surface: #1e1b25; --sunk: #26222f; --line: #363143; --fg: #ece9f2; --muted: #a39cb2;
  --accent: #b39af0; --accent-soft: #2e2645; --on-accent: #15131a; --good: #5fcf96; --warn: #e6b24a; --bad: #f07a72;
  --good-soft: #1b3328; --warn-soft: #3a2f17; --bad-soft: #3d201e; --maipu: #e2c157; --scrim: rgb(0 0 0 / .6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #15131a; --surface: #1e1b25; --sunk: #26222f; --line: #363143; --fg: #ece9f2; --muted: #a39cb2;
  --accent: #b39af0; --accent-soft: #2e2645; --on-accent: #15131a; --good: #5fcf96; --warn: #e6b24a; --bad: #f07a72;
  --good-soft: #1b3328; --warn-soft: #3a2f17; --bad-soft: #3d201e; --maipu: #e2c157; --scrim: rgb(0 0 0 / .6); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--font-body); -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
body.locked { overflow: hidden; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── top bar ── */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 10px 8px; display: flex; flex-direction: column; gap: 8px; }
.bar .row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.bar h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; flex: 1; min-width: 0; }
.bar h1 small { display: block; font: 400 12px/1.3 var(--font-body); color: var(--muted); letter-spacing: 0; }
.icon { border: 1px solid var(--line); background: var(--surface); height: 38px; min-width: 38px; padding: 0 10px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-size: 14px; color: var(--fg); white-space: nowrap; }
.icon[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.dot.err { background: var(--bad); }
.tabs { display: flex; background: var(--sunk); border-radius: 10px; padding: 3px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
@media (max-width: 999px) { .tabs { -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent); mask-image: linear-gradient(90deg, #000 88%, transparent); } }
.tabs button { flex: 1 0 auto; border: 0; background: transparent; padding: 7px 4px; border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 14px; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); font-weight: 600; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.tabs .n { font: 500 12px var(--font-data); opacity: .8; margin-left: 3px; }
.tools { display: flex; gap: 8px; }
.tools input, .tools select { height: 38px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; min-width: 0; }
.tools input { flex: 1 1 auto; }
.tools select { flex: 0 1 auto; max-width: 40%; }
.tools .icon { flex: none; }

/* ── info panel (sources + how we score) ── */
.info { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 14px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.info p { margin: 0; color: var(--muted); font-size: 13.5px; max-width: 65ch; }
.status { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: 12px; background: var(--sunk); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.err { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.wbar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; gap: 2px; margin-top: 6px; }
.wlegend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.wlegend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }

/* ── map ── */
/* isolation keeps Leaflet's own z-indexes (400–1000) inside the map, so the open house sheet covers it on mobile */
.map { margin: 12px var(--gutter-r) 0 var(--gutter-l); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; position: relative; z-index: 0; isolation: isolate; }
#lmap { height: 62vh; min-height: 320px; max-height: 640px; background: var(--sunk); }
.map .cap { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--muted); padding: 8px 10px; }
.map .cap i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 4px; }
.leaflet-container { font: 12px var(--font-body); }
.ref-label { background: transparent; border: 0; box-shadow: none; font: 600 11px var(--font-body); color: #3b3546; text-shadow: 0 0 3px #fff, 0 0 3px #fff; padding: 0; }
.ref-label::before { display: none; }
.pin { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font: 700 11px var(--font-display); color: #fff; border: 2px solid #fff; box-shadow: 0 1px 4px rgb(0 0 0 / .35); }
.pin.hi { background: #1f7a4d; } .pin.mid { background: #a76a00; } .pin.lo { background: #b3322d; } .pin.out { background: #8a8494; opacity: .55; width: 12px; height: 12px; border-width: 1.5px; box-shadow: none; }
.pin.on { outline: 3px solid var(--accent); outline-offset: 1px; }

/* ── list ── */
.layout { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 12px calc(32px + env(safe-area-inset-bottom, 0px)); }
.list { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; cursor: pointer; text-align: left; width: 100%; padding: 0; color: inherit; }
.card[aria-current="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.ph { position: relative; aspect-ratio: 16 / 10; max-width: 100%; background: var(--sunk); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .badge { position: absolute; top: 10px; right: 10px; }
.ph .tl { position: absolute; top: 10px; left: 10px; display: flex; gap: 4px; flex-wrap: wrap; max-width: 70%; }
.ph .tl .pill { background: rgb(20 16 28 / .72); color: #fff; backdrop-filter: blur(4px); }
.ph .rank { position: absolute; bottom: 10px; left: 10px; font: 500 12px var(--font-data); color: #fff; background: rgb(20 16 28 / .72); padding: 1px 8px; border-radius: 999px; }
.cbody { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.cprice { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.cprice b { font: 600 21px/1.2 var(--font-display); }
.cprice span { color: var(--muted); font-size: 13px; }
.specs { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 13.5px; color: var(--muted); }
.specs b { color: var(--fg); font-weight: 600; }
.brief { margin: 0; font-size: 14.5px; line-height: 1.45; }
.brief.none { color: var(--muted); font-size: 13.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chips .pill { font-size: 11.5px; }
.mini { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--sunk); gap: 1px; }
.badge { font: 700 20px/1 var(--font-display); width: 50px; height: 50px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.badge.hi { background: var(--good-soft); color: var(--good); }
.badge.mid { background: var(--warn-soft); color: var(--warn); }
.badge.lo { background: var(--bad-soft); color: var(--bad); }
.badge.out { background: var(--sunk); color: var(--muted); font-size: 16px; }
.ph .badge.out:empty, .ph .badge.dash { display: none; }
.badge { flex-direction: column; gap: 1px; }
.badge small { font: 500 10px var(--font-data); opacity: .85; }
.mine { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mine .btn { padding: 0 8px; font-size: 14px; }
.note { width: 100%; min-height: 72px; resize: vertical; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); font: 14px/1.45 var(--font-body); }
.saved { font-size: 12px; color: var(--muted); min-height: 1em; }
.prefs { width: 100%; min-height: 220px; resize: vertical; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); font: 13px/1.5 var(--font-data); }
.row2 { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row2 input { flex: 1 1 200px; min-width: 0; height: 38px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; background: var(--bg); }
.reasons { margin: 6px 0 0; padding-left: 18px; font-size: 13.5px; }
.vq { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.vq button { width: 100%; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; color: inherit; font: 14px/1.4 var(--font-body); cursor: pointer; display: flex; gap: 10px; align-items: flex-start; }
.vq button > span { flex: 1; min-width: 0; }
.vq button small { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; }
.vq button i { font-style: normal; color: var(--accent); font-weight: 600; flex: none; }
.vq button.in { opacity: .6; }
.vq button.in i { color: var(--good); }
.vqhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.qa { display: flex; gap: 8px; margin-top: 2px; }
.qa .btn { flex: 1; min-height: 40px; font-size: 14px; padding: 0 11px; white-space: nowrap; }
.qa .btn:not(.primary) { flex: 0 1 auto; }
.flash { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; box-shadow: 0 4px 16px rgb(0 0 0 / .25); }
label { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; }
.empty { padding: 32px 16px; text-align: center; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; }
.more { align-self: center; }

/* ── detail sheet ── */
.detail { position: fixed; inset: 0; z-index: 20; background: var(--surface); overflow-y: auto; overscroll-behavior: contain; }
.detail[hidden] { display: none; }
.dtop { position: sticky; top: 0; z-index: 2; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px;
  padding-top: calc(8px + env(safe-area-inset-top, 0px)); padding-bottom: 8px; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.dtop .t { flex: 1; min-width: 0; }
.dtop .t b { display: block; font: 600 17px/1.2 var(--font-display); }
.dtop .t span { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dtop .badge { width: 42px; height: 42px; font-size: 17px; border-radius: 10px; }
.gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 2px; background: var(--sunk); scrollbar-width: none; }
.gallery::-webkit-scrollbar { display: none; }
.gallery img { flex: 0 0 100%; width: 100%; aspect-ratio: 4 / 3; max-width: 100%; object-fit: cover; scroll-snap-align: center; display: block; }
.gcount { font: 500 12px var(--font-data); color: var(--muted); text-align: right; padding: 4px var(--gutter-r) 0 var(--gutter-l); }
.dbody { padding-left: var(--gutter-l); padding-right: var(--gutter-r); padding-block: 12px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 18px; }
.dbody h2 { font-size: 20px; }
.addr { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.lead { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; }
.lead p { margin: 4px 0 0; font-size: 15.5px; line-height: 1.45; }
.lead .label { color: var(--accent); }
.discard { background: var(--bad-soft); color: var(--bad); border-radius: 12px; padding: 10px 14px; font-size: 14px; }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--sunk); border-radius: 10px; padding: 8px 12px; min-width: 0; }
.fact span { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.fact b { font: 500 15px var(--font-data); }
.actions { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); min-height: 44px; padding: 0 14px; border-radius: 12px; cursor: pointer; text-decoration: none; color: var(--fg); font-weight: 500; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.section { display: flex; flex-direction: column; gap: 8px; }
.ai { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.ai p { margin: 0; }
.ai ul { margin: 0; padding-left: 18px; }
.ai .num { font-size: 13px; color: var(--muted); }
.breakdown { display: grid; grid-template-columns: 96px minmax(0, 1fr) 50px; gap: 6px 10px; align-items: center; font-size: 13.5px; }
.breakdown .track { height: 8px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.breakdown .track i { display: block; height: 100%; border-radius: 4px; }
.breakdown .why { grid-column: 1 / 4; color: var(--muted); font-size: 12.5px; margin: -2px 0 4px; }
.breakdown .pts { text-align: right; }
.desc { white-space: pre-line; color: var(--muted); font-size: 13.5px; }
.desc.clamp { max-height: 9.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 60%, transparent); mask-image: linear-gradient(#000 60%, transparent); }
.linkish { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font-size: 14px; align-self: start; }
footer { color: var(--muted); font-size: 12px; max-width: 70ch; margin-top: 24px; }

/* ── photo strips: swipe on the card and in the sheet, tap for full screen ── */
.strip { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; background: var(--sunk); }
.strip::-webkit-scrollbar { display: none; }
.strip img { color: transparent; flex: 0 0 100%; width: 100%; min-width: 0; object-fit: cover; scroll-snap-align: center; scroll-snap-stop: always; display: block; cursor: zoom-in; background: var(--sunk); }
.ph .strip { position: absolute; inset: 0; }
.ph .strip img { height: 100%; }
.ph .count { position: absolute; bottom: 10px; right: 10px; font: 500 12px var(--font-data); color: #fff; background: rgb(20 16 28 / .72); padding: 1px 8px; border-radius: 999px; pointer-events: none; }
.ph .tl, .ph .rank, .ph .badge { pointer-events: none; }
.snav { position: absolute; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgb(255 255 255 / .9); color: #1d1a24;
  font-size: 18px; line-height: 1; cursor: pointer; display: none; place-items: center; box-shadow: 0 1px 4px rgb(0 0 0 / .3); z-index: 1; }
.snav.prev { left: 8px; } .snav.next { right: 8px; }
@media (hover: hover) and (pointer: fine) { .ph:hover .snav, .gwrap:hover .snav { display: grid; } }
.gwrap { position: relative; }
.viewer { position: fixed; inset: 0; z-index: 40; background: #000; display: flex; flex-direction: column; }
.viewer .strip { flex: 1; background: #000; }
.viewer .strip img { object-fit: contain; height: 100%; background: #000; cursor: default; }
.vtop { position: absolute; top: 0; left: 0; right: 0; z-index: 2; display: flex; justify-content: space-between; align-items: center;
  padding: calc(10px + env(safe-area-inset-top, 0px)) var(--gutter-r) 10px var(--gutter-l); color: #fff; background: linear-gradient(rgb(0 0 0 / .55), transparent); pointer-events: none; }
.vtop > * { pointer-events: auto; }
.vtop .num { font-size: 14px; }
.vtop button { background: rgb(255 255 255 / .16); color: #fff; border: 0; width: 42px; height: 42px; border-radius: 50%; font-size: 20px; cursor: pointer; }
.viewer .snav { display: grid; }
@media (hover: none) { .viewer .snav { display: none; } }

/* ── filters sheet ── */
.fbtn .n { background: var(--accent); color: var(--on-accent); border-radius: 999px; font: 600 11px/18px var(--font-data); min-width: 18px; padding: 0 5px; }
.scrim { position: fixed; inset: 0; z-index: 30; background: var(--scrim); }
.sheet { position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; max-height: 88vh; max-height: 88dvh; background: var(--surface); border-radius: 18px 18px 0 0;
  display: flex; flex-direction: column; box-shadow: 0 -8px 30px rgb(0 0 0 / .25); }
.shead { display: flex; align-items: center; gap: 8px; padding: 14px var(--gutter-r) 10px var(--gutter-l); border-bottom: 1px solid var(--line); }
.shead h2 { flex: 1; font-size: 18px; }
.sbody { overflow-y: auto; overscroll-behavior: contain; padding: 6px var(--gutter-r) 16px var(--gutter-l); display: flex; flex-direction: column; gap: 18px; }
.sfoot { padding: 10px var(--gutter-r) calc(12px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); border-top: 1px solid var(--line); display: flex; gap: 8px; }
.sfoot .btn { flex: 1; }
.rng .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.rng .top b { font: 500 13.5px var(--font-data); color: var(--fg); text-align: right; }
.rng .top b.any { color: var(--muted); font-weight: 400; }
.dual { position: relative; height: 34px; margin: 0 4px; }
.dual .track { position: absolute; left: 0; right: 0; top: 15px; height: 4px; border-radius: 2px; background: var(--sunk); }
.dual .fill { position: absolute; top: 15px; height: 4px; border-radius: 2px; background: var(--accent); }
.dual input { position: absolute; left: -4px; width: calc(100% + 8px); top: 0; height: 34px; margin: 0; background: none; pointer-events: none; -webkit-appearance: none; appearance: none; }
.dual input::-webkit-slider-runnable-track { background: none; border: 0; }
.dual input::-moz-range-track { background: none; border: 0; }
.dual input::-webkit-slider-thumb { -webkit-appearance: none; pointer-events: auto; width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 1px 3px rgb(0 0 0 / .25); cursor: grab; }
.dual input::-moz-range-thumb { pointer-events: auto; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 1px 3px rgb(0 0 0 / .25); cursor: grab; }
.choices { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.choices button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; }

<script type="application/json" id="hh-data">__HH_DATA__</script>
<script>
const LABELS = { price: "Precio", space: "Espacio", location: "Ubicación", condition: "Estado", patio: "Patio",
  vertical: "Crecer arriba", credit: "Apto crédito", garage: "Cochera", quiet: "Tranquilidad", light: "Luz" };
const COLORS = { price: "#6a46b8", space: "#8e6fd1", location: "#2e7fa8", condition: "#1f8a6a", patio: "#4fa35a",
  vertical: "#93a83a", credit: "#c9a227", garage: "#c47a2c", quiet: "#a8577e", light: "#d6b56b" };
const SRC = { zonaprop: "Zonaprop", mercadolibre: "Mercado Libre", argenprop: "Argenprop", tokko: "Inmobiliarias" };
const PATIO = { none: "sin patio", small: "patio chico", medium: "patio mediano", large: "patio grande" };
const TABS = { short: "Bandeja", fav: "★ Favoritas", visited: "Visitadas", mine: "Descartadas", reserved: "Reservadas", out: "Filtradas", all: "Todas" };
const CARTO_KEY = "__CARTO_KEY__";        // filled in at deploy time
const REPO = "TomasAM2233/house-hunter";   // where tags and preferences are saved
const PAGE = 30;
const srcName = l => l.source === "tokko" ? (l.publisher || "Inmobiliaria") : (SRC[l.source] || l.source);
const $ = s => document.querySelector(s);
const usd = n => n == null ? "Precio a consultar" : "USD " + Math.round(n).toLocaleString("es-AR");
const blk = n => n == null ? "?" : Math.round(n).toLocaleString("es-AR");   // cuadras: whole numbers read faster
const day = d => { const t = Date.parse(d + "T12:00"); return isNaN(t) ? (d || "?") : new Date(t).toLocaleDateString("es-AR", { day: "numeric", month: "short" }); };
const fmt = n => n == null ? "?" : (Math.round(n * 10) / 10).toLocaleString("es-AR");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const wide = matchMedia("(min-width: 1000px)");
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let DATA, view = "short", sel = null, shown = PAGE;
let TAGS = store.get("hh-tags", {});           // {id: {fav, visited, dismissed, note, at}}
let PREFS = "", pctMode = "saved", SETTINGS = { alert_percentile: 90, alert_ai_score: 70 };
for (const id of store.get("hh-favs", [])) (TAGS[id] ||= {}).fav = true;   // favourites from the first version
let FILT = store.get("hh-filters", { r: {}, c: {} });   // filters: r = {key: [lo, hi]}, c = {group: [values]}
let AIP = store.get("hh-ai-pending", {});               // AI reads asked for and not back yet: {id: requested at}
const AIMSG = {}, PCTSHOW = new Set();

/* ── overlays (house sheet, photo viewer, filters) close with the phone's back gesture ── */
const layers = [];
function openLayer(name, close) {
  if (layers.some(x => x.name === name)) return;
  layers.push({ name, close });
  try { history.pushState({ layer: name }, ""); } catch {}
}
function closeLayer(name) {
  const i = layers.findIndex(x => x.name === name);
  if (i < 0) return;
  if (i === layers.length - 1 && history.state?.layer === name) return history.back();   // popstate closes it
  layers.splice(i, 1)[0].close();
}
addEventListener("popstate", () => { const top = layers.pop(); if (top) top.close(); });
function unlock() { if (wide.matches || ($("#detail").hidden && $("#viewer").hidden && $("#filters").hidden)) document.body.classList.remove("locked"); }

/* ── tags, synced through the repo when a GitHub token is set ── */
const gh = {
  token: () => store.get("hh-token", ""),
  shas: {},
  async get(path) {
    const r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}?ref=main`, { headers: { Authorization: `Bearer ${gh.token()}`, Accept: "application/vnd.github+json" }, cache: "no-store" });
    if (r.status === 404) return null;
    if (!r.ok) throw new Error(`GitHub ${r.status}`);
    const j = await r.json(); gh.shas[path] = j.sha;
    return new TextDecoder().decode(Uint8Array.from(atob(j.content.replace(/\n/g, "")), c => c.charCodeAt(0)));
  },
  async put(path, text, msg) {
    const body = { message: msg, content: btoa(String.fromCharCode(...new TextEncoder().encode(text))), branch: "main" };
    if (gh.shas[path]) body.sha = gh.shas[path];
    let r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, { method: "PUT", headers: { Authorization: `Bearer ${gh.token()}`, Accept: "application/vnd.github+json" }, body: JSON.stringify(body) });
    if (r.status === 409 || r.status === 422) { await gh.get(path); body.sha = gh.shas[path]; r = await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, { method: "PUT", headers: { Authorization: `Bearer ${gh.token()}`, Accept: "application/vnd.github+json" }, body: JSON.stringify(body) }); }
    if (!r.ok) throw new Error(`GitHub ${r.status}`);
    gh.shas[path] = (await r.json()).content.sha;
  },
};
let syncTimer = null, syncState = "";
function setSync(t) { syncState = t; const e = $("#syncstate"); if (e) e.textContent = t; const d = $("#saved"); if (d) d.textContent = t; }
async function syncTags() {
  const remote = JSON.parse(await gh.get("data/tags.json") || "{}");
  for (const [id, t] of Object.entries(remote)) if (!TAGS[id] || (t.at || "") > (TAGS[id].at || "")) TAGS[id] = t;
  await gh.put("data/tags.json", JSON.stringify(TAGS, null, 1), "app: tags");
  store.set("hh-tags", TAGS); setSync("Sincronizado ✓");
}
function saveTags() {
  store.set("hh-tags", TAGS);
  if (!gh.token()) { setSync("Guardado en este dispositivo"); return; }
  setSync("Guardando…");
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async () => {
    try { await syncTags(); }
    catch (e) { setSync("No pude sincronizar (" + e.message + "); quedó guardado en este dispositivo"); }
  }, 900);
}
function tag(id) { return TAGS[id] || {}; }
function setTag(id, k, v) {
  const t = TAGS[id] = { ...tag(id), [k]: v, at: new Date().toISOString() };
  if (k === "dismissed" && v) t.fav = false;
  if (k === "fav" && v) t.dismissed = false;
  saveTags();
}
async function loadShared() {
  try {
    let tags, prefs;
    let settings, results;
    if (gh.token()) { tags = await gh.get("data/tags.json"); prefs = await gh.get("data/preferences.md"); settings = await gh.get("data/settings.json");
                      results = await gh.get("data/ai_results.json").catch(() => null); setSync("Sincronizado ✓"); }
    else { const get = (f, d) => fetch(f, { cache: "no-store" }).then(r => r.ok ? r.text() : d).catch(() => d);
           [tags, prefs, settings, results] = await Promise.all([get("tags.json", null), get("preferences.md", ""), get("settings.json", null), get("ai_results.json", null)]); }
    if (settings) SETTINGS = { ...SETTINGS, ...JSON.parse(settings) };
    if (results) applyResults(JSON.parse(results), true);
    for (const [id, t] of Object.entries(JSON.parse(tags || "{}"))) if (!TAGS[id] || (t.at || "") > (TAGS[id].at || "")) TAGS[id] = t;
    store.set("hh-tags", TAGS);
    PREFS = prefs || "";
  } catch (e) { setSync("No pude leer GitHub: " + e.message); }
  renderList(); renderInfo();
  if (sel) renderDetail(DATA.listings.find(x => x.id === sel));
  if (Object.keys(AIP).length) pollAI();
}

/* ── "Evaluar con IA": commit a request file (the assess workflow picks it up), then poll data/ai_results.json ── */
async function requestAI(l) {
  if (!gh.token()) { flash("Conectá GitHub en Info para pedirle evaluaciones a la IA"); if ($("#info").hidden) $("#infobtn").click(); return; }
  const box = $("#note");
  if (box && sel === l.id && box.value.trim() !== (tag(l.id).note || "")) { TAGS[l.id] = { ...tag(l.id), note: box.value.trim(), at: new Date().toISOString() }; store.set("hh-tags", TAGS); }
  clearTimeout(syncTimer);
  AIMSG[l.id] = "Guardando tus notas…"; renderAIState(l);
  try {
    await syncTags();   // the workflow reads the note from data/tags.json, so it has to be there first
    const at = new Date().toISOString();
    await gh.put(`data/ai_requests/${l.id}.json`, JSON.stringify({ id: l.id, at }, null, 1), `app: evaluar ${l.id}`);
    AIP[l.id] = at; store.set("hh-ai-pending", AIP);
    delete AIMSG[l.id];
    pollAI();
  } catch (e) { AIMSG[l.id] = "No pude pedirla: " + e.message; }
  renderAIState(l);
}
function renderAIState(l) {
  const b = $("#aibtn"), st = $("#aistate");
  if (!b || sel !== l.id) return;
  const at = AIP[l.id];
  b.disabled = !!at || AIMSG[l.id] === "Guardando tus notas…";
  b.textContent = at ? "Evaluando…" : "✨ Evaluar con IA";
  st.textContent = at ? `Pedida a las ${new Date(at).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit", hour12: false })}. Tarda 1 a 3 minutos; podés seguir usando la app.` : (AIMSG[l.id] || "");
}
function applyResults(R, onLoad = false) {
  const gen = Date.parse((DATA.generated_at || "").replace(" ", "T") + "Z") || 0;
  let changed = false;
  for (const [id, r] of Object.entries(R || {})) {
    const mine = AIP[id] && r.requested_at === AIP[id];
    // on load, results newer than the data file; while polling, only the answer to this device's request
    if (!(mine || (onLoad && Date.parse(r.done_at) > gen))) continue;
    if (r.listing) {
      const i = DATA.listings.findIndex(x => x.id === id);
      if (i >= 0) DATA.listings[i] = { ...r.listing, thumbs: DATA.listings[i].thumbs }; else DATA.listings.push(r.listing);
      changed = true;
    }
    if (mine) {
      delete AIP[id];
      const l = DATA.listings.find(x => x.id === id);
      AIMSG[id] = r.error ? `La IA no pudo terminar (${r.error}).` : `Listo: la IA le puso ${l?.ai_final?.score ?? Math.round(l?.score)}/100 con tus notas.`;
      flash(r.error ? "La evaluación de la IA falló" : `IA: ${l?.ai_final?.score ?? Math.round(l?.score)}/100 · ${l?.address || ""}`);
    }
  }
  store.set("hh-ai-pending", AIP);
  if (changed && pctMode === "now") recalcPct();
  return changed;
}
async function pollAI() {
  if (pollAI.t) return;
  const tick = async () => {
    for (const [id, at] of Object.entries(AIP)) if (Date.now() - Date.parse(at) > 15 * 60e3) {
      delete AIP[id]; AIMSG[id] = "Tardó demasiado. Mirá GitHub → Actions → assess para ver qué pasó.";
    }
    store.set("hh-ai-pending", AIP);
    let changed = false;
    if (!Object.keys(AIP).length || !gh.token()) { clearInterval(pollAI.t); pollAI.t = null; }
    else try { changed = applyResults(JSON.parse(await gh.get("data/ai_results.json") || "{}")); } catch {}
    const l = sel && DATA.listings.find(x => x.id === sel);
    if (changed) { renderList(); if (l) renderDetail(l); }   // only then: a re-render would drop a note being typed
    else if (l) renderAIState(l);
  };
  pollAI.t = setInterval(tick, 20000);
  setTimeout(tick, 15000);
}

/* ── visit questions from the AI verdict: tap one (or "todas") to copy it into the notes as "pregunta → ",
   answer it during the visit, then Evaluar con IA reads the answers as verified facts ── */
const visitQs = (l, k) => (l.ai_final?.[k] || []).filter(x => x?.q);
const inNote = (note, q) => (note || "").toLowerCase().includes(q.toLowerCase());
function visitBox(l, t) {
  const f = l.ai_final;
  if (!f) return "";
  const groups = [["questions", "Preguntas que mueven el puntaje"], ["general_questions", "Para preguntar igual en la visita"]];
  if (!groups.some(([k]) => visitQs(l, k).length))
    return `<div class="section"><span class="label">Preguntas para la visita</span><span class="saved">Tocá Evaluar con IA y te armo las preguntas para esta casa.</span></div>`;
  return groups.filter(([k]) => visitQs(l, k).length).map(([k, label]) => `<div class="section">
      <div class="vqhead"><span class="label">${label}</span><button class="linkish" data-vqall="${k}" style="white-space:nowrap">Todas a notas</button></div>
      <ul class="vq">${visitQs(l, k).map(x => `<li><button data-vq="${esc(x.q)}" class="${inNote(t.note, x.q) ? "in" : ""}"><span>${esc(x.q)}${x.impact ? `<small>${esc(x.impact)}</small>` : ""}</span><i>${inNote(t.note, x.q) ? "✓" : "+"}</i></button></li>`).join("")}</ul>
    </div>`).join("");
}
function markAsked(l) {
  const note = $("#note")?.value || "";
  $("#detail").querySelectorAll("[data-vq]").forEach(b => { const on = inNote(note, b.dataset.vq); b.classList.toggle("in", on); b.querySelector("i").textContent = on ? "✓" : "+"; });
}
function addQuestions(l, qs) {
  const box = $("#note");
  const cur = box.value.replace(/\s+$/, "");
  const add = qs.filter(q => !inNote(cur, q));
  if (!add.length) { flash("Ya están en tus notas"); return; }
  box.value = (cur ? cur + "\n" : "") + add.map(q => `${q} → `).join("\n");
  setTag(l.id, "note", box.value.trim());
  markAsked(l); renderList();
  const at = box.value.indexOf(add[0]) + add[0].length + 3;   // cursor right after the first new "→ ", ready to answer
  box.focus(); box.setSelectionRange(at, at);
  flash(add.length === 1 ? "Pregunta agregada a tus notas" : `${add.length} preguntas agregadas a tus notas`);
}

/* ── percentile of one house, on demand ── */
function pctLines(l) {
  const sc = x => x.score_calc ?? x.score;
  const rank = (vals, v) => { const below = vals.filter(x => x < v).length; return Math.round(100 * below / Math.max(1, vals.length)); };
  const all = DATA.listings.map(sc), pass = DATA.listings.filter(x => !x.discard.length).map(sc);
  const ai = DATA.listings.filter(x => x.ai_final).map(x => x.ai_final.score);
  const out = [`Algoritmo <b>${fmt(sc(l))}</b> → percentil <b>${rank(all, sc(l))}</b> de ${all.length} casas puntuadas`];
  if (!l.discard.length) out.push(`Entre las ${pass.length} que pasan los filtros: percentil <b>${rank(pass, sc(l))}</b>`);
  if (l.ai_final) out.push(`IA <b>${l.ai_final.score}</b> → percentil <b>${rank(ai, l.ai_final.score)}</b> de ${ai.length} evaluadas por la IA`);
  return out.map(x => `<span>${x}</span>`).join("");
}

/* ── data helpers ── */
function band(s, l) { if (l.discard?.length || tag(l.id).dismissed) return "out"; return s >= 62 ? "hi" : s >= 50 ? "mid" : "lo"; }
function img(l, i) { return (l.thumbs && l.thumbs[i]) || (l.photos && l.photos[i]) || null; }
function ppm2(l) { return l.price_usd && l.total_m2 ? Math.round(l.price_usd / l.total_m2) : null; }
const brief = l => l.ai_final?.brief || l.ai?.brief || l.ai?.summary || "";
const pct = l => pctMode === "now" ? l.pct_now : l.pct;

function recalcPct() {
  const sc = l => l.score_calc ?? l.score;   // same scale for everyone: the algorithm's score
  const all = DATA.listings.map(sc).sort((a, b) => a - b);
  const lo = x => { let a = 0, b = all.length; while (a < b) { const m = (a + b) >> 1; all[m] < x ? a = m + 1 : b = m; } return a; };
  for (const l of DATA.listings) l.pct_now = Math.round(100 * lo(sc(l)) / all.length);
  pctMode = "now"; DATA.pct_n_now = all.length;
}

/* ── filters: two-ended sliders for numbers, chips for the rest ── */
const PATIO_RANK = { none: 0, small: 1, medium: 2, large: 3 };
const RANGES = [
  ["price", "Precio", l => l.price_usd, 5000, v => "USD " + Math.round(v / 1000) + "k"],
  ["total", "Superficie total", l => l.total_m2, 5, v => v + " m²"],
  ["covered", "Superficie cubierta", l => l.covered_m2, 5, v => v + " m²"],
  ["amb", "Ambientes", l => l.ambientes, 1, v => v],
  ["bed", "Dormitorios", l => l.bedrooms, 1, v => v],
  ["bath", "Baños", l => l.bathrooms, 1, v => v],
  ["ppm2", "USD por m² total", l => ppm2(l), 50, v => v.toLocaleString("es-AR")],
  ["maipu", "Cuadras a Av. Maipú", l => l.geo?.maipu_blocks, 1, v => v],
  ["train", "Cuadras al tren", l => l.geo?.station?.blocks, 1, v => v],
  ["score", "Puntaje", l => l.score, 1, v => v],
  ["age", "Antigüedad (años)", l => l.age_years, 1, v => v],
  ["reform", "Reforma estimada por la IA", l => l.ai?.reform_usd, 2500, v => "USD " + Math.round(v / 1000) + "k"],
];
const CHOICES = [
  ["type", "Tipo", [["casa", "Casa"], ["ph", "PH"]]],
  ["zone", "Barrio", [["Olivos", "Olivos"], ["Florida", "Florida"], ["La Lucila", "La Lucila"]]],
  ["src", "Fuente", [["zonaprop", "Zonaprop"], ["argenprop", "Argenprop"], ["mercadolibre", "Mercado Libre"], ["tokko", "Inmobiliarias"]]],
  ["patio", "Patio (según la IA)", [["small", "Chico o más"], ["medium", "Mediano o más"], ["large", "Grande"]]],
  ["extra", "Tiene que tener", [["garage", "Cochera"], ["credit", "Apto crédito"], ["ai", "Evaluada por la IA"], ["note", "Mis notas"], ["drop", "Bajó de precio"], ["new", "Nueva (7 días)"], ["exact", "Ubicación exacta"]]],
];
const EXTRA = {
  garage: l => l.garage > 0, credit: l => l.components?.credit?.value === 1, ai: l => !!l.ai_final, note: l => !!tag(l.id).note,
  drop: l => { const h = l.price_history || []; return h.length > 1 && h[h.length - 1][1] < h[0][1]; },
  new: l => Date.now() - Date.parse(l.first_seen + "T12:00") < 7 * 864e5, exact: l => !!l.address_exact,
};
let BOUNDS = {};
function calcBounds() {
  for (const [k, , get, step] of RANGES) {
    const v = DATA.listings.filter(l => l.active !== false && !l.duplicate_of).map(get).filter(x => x != null && isFinite(x)).sort((a, b) => a - b);
    if (!v.length) { BOUNDS[k] = [0, step]; continue; }
    const lo = Math.floor(v[0] / step) * step, hi = v[Math.min(v.length - 1, Math.floor(v.length * 0.98))];   // past the 98th percentile is "or more"
    BOUNDS[k] = [lo, Math.max(Math.ceil(hi / step) * step, lo + step)];
  }
}
function passF(l) {
  for (const [k, , get] of RANGES) {
    const f = FILT.r[k]; if (!f) continue;
    const v = get(l), [a, b] = BOUNDS[k] || [];
    if (v == null) return false;                    // narrowed: unknowns are out
    if (f[0] > a && v < f[0]) return false;
    if (f[1] < b && v > f[1]) return false;
  }
  const c = FILT.c;
  if (c.type?.length && !c.type.includes(l.type)) return false;
  if (c.zone?.length && !c.zone.includes(l.zone)) return false;
  if (c.src?.length && !c.src.includes(l.source)) return false;
  if (c.patio?.length && !((PATIO_RANK[l.ai?.patio] ?? -1) >= Math.min(...c.patio.map(x => PATIO_RANK[x])))) return false;
  for (const x of c.extra || []) if (!EXTRA[x](l)) return false;
  return true;
}
const nFilt = () => Object.keys(FILT.r).length + Object.values(FILT.c).filter(v => v?.length).length;

// Each house lives in one bucket: the inbox until Tomás processes it, then favourite → visited, or dismissed.
function bucket(l) { const t = tag(l.id); return t.dismissed ? "mine" : t.visited ? "visited" : t.fav ? "fav" : "short"; }
function base() {
  const tagged = DATA.listings.filter(l => !l.duplicate_of && passF(l));
  const act = tagged.filter(l => l.active !== false);
  return {
    short: act.filter(l => !l.discard.length && bucket(l) === "short"),
    fav: tagged.filter(l => bucket(l) === "fav"),
    visited: tagged.filter(l => bucket(l) === "visited"),
    mine: tagged.filter(l => bucket(l) === "mine"),
    // taken down from the portal (likely booked): kept so percentiles count them
    reserved: tagged.filter(l => l.active === false),
    out: act.filter(l => l.discard.length),
    all: act,
  };
}
function rows() {
  let r = base()[view];
  const q = $("#q").value.trim().toLowerCase();
  if (q) r = r.filter(l => (l.title + " " + l.address + " " + l.description + " " + brief(l) + " " + (tag(l.id).note || "")).toLowerCase().includes(q));
  const key = { score: l => -l.score, price: l => l.price_usd ?? 1e9, ppm2: l => ppm2(l) ?? 1e9,
    m2: l => -(l.total_m2 ?? 0), new: l => -(Date.parse(l.first_seen) || 0) }[$("#sort").value];
  return r.slice().sort((a, b) => key(a) - key(b));
}

/* ── photos: every stored photo, swipeable on the card and in the sheet; tap opens the full-screen viewer ── */
const photos = l => (l.photos?.length ? l.photos : (l.thumbs || [])).filter(Boolean);
const big = u => u.replace("/720x532/", "/1200x1200/");   // Zonaprop serves a larger size for the viewer
function strip(pics, cls = "", lazy = true) {
  // only the first two load up front; the rest load as you swipe (see stripLoad)
  return `<div class="strip ${cls}">${pics.map((p, i) => `<img ${i < 2 ? `src="${esc(p)}"${lazy ? ' loading="lazy"' : ""}` : `data-src="${esc(p)}"`} data-i="${i}" alt="Foto ${i + 1}" decoding="async" draggable="false">`).join("")}</div>`;
}
const snav = n => n > 1 ? `<button class="snav prev" data-nav="-1" aria-label="Foto anterior">‹</button><button class="snav next" data-nav="1" aria-label="Foto siguiente">›</button>` : "";
function stripLoad(s) {
  const i = Math.round(s.scrollLeft / Math.max(1, s.clientWidth));
  for (let k = i - 1; k <= i + 2; k++) { const im = s.children[k]; if (im?.dataset.src) { im.src = im.dataset.src; delete im.dataset.src; } }
  const c = s.closest("[data-sw]")?.querySelector("[data-count]");
  if (c) c.textContent = `${Math.min(i + 1, s.children.length)} / ${s.children.length}`;
  return i;
}

function nav(btn) { const s = btn.closest("[data-sw]").querySelector(".strip"); s.scrollBy({ left: +btn.dataset.nav * s.clientWidth, behavior: "smooth" }); }

  v.hidden = false; document.body.classList.add("locked");
  const s = v.querySelector(".strip");

}

document.addEventListener("click", e => {

  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png" + (CARTO_KEY.startsWith("__") ? "" : "?key=" + CARTO_KEY), {
    maxZoom: 19, subdomains: "abcd", attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> · © <a href="https://carto.com/attributions">CARTO</a>' }).addTo(MAP);
  const lines = (ws, style, name) => (ws || []).forEach((w, i) => { const pl = L.polyline(w, style).addTo(MAP); if (i === 0 && name) pl.bindTooltip(name, { sticky: true }); });
  lines(ref.general_paz, { color: "#6b6578", weight: 6, opacity: .55 }, "Av. General Paz");
  lines(ref.panamericana, { color: "#6b6578", weight: 6, opacity: .55 }, "Panamericana");
  lines(ref.belgrano, { color: "#2e7fa8", weight: 2.5, opacity: .7, dashArray: "6 5" }, "Belgrano Norte");
  lines(ref.mitre, { color: "#b3322d", weight: 3, opacity: .85, dashArray: "8 5" }, "Tren Mitre");
  lines(ref.maipu, { color: "#c9a227", weight: 5, opacity: .9 }, "Av. Maipú");
  (ref.cementerio || []).forEach(poly => L.polygon(poly, { color: "#4fa35a", weight: 1, fillOpacity: .25 }).addTo(MAP).bindTooltip("Cementerio de Olivos"));
  (ref.parks || []).forEach(p => L.polygon(p.ring, { color: "#4fa35a", weight: 1, fillOpacity: .35 }).addTo(MAP).bindTooltip(p.name));
  if (ref.villa) L.circle(ref.villa.center, { radius: ref.villa.radius_m, color: "#b3322d", weight: 1.5, dashArray: "5 4", fillOpacity: .08 }).addTo(MAP).bindTooltip("Villa Borges + 4 cuadras (descartado)", { sticky: true });
  const place = (ll, name, color) => L.circleMarker(ll, { radius: 6, color: "#fff", weight: 2, fillColor: color, fillOpacity: 1 }).addTo(MAP)
    .bindTooltip(name, { permanent: true, direction: "right", className: "ref-label", offset: [6, 0] });
  for (const [n, [la, lo]] of Object.entries(ref.stations || {})) L.circleMarker([la, lo], { radius: 4, color: "#1d1a24", weight: 1.5, fillColor: "#fff", fillOpacity: 1 }).addTo(MAP)
    .bindTooltip(n, { permanent: true, direction: "right", className: "ref-label", offset: [4, 0] });
  for (const [n, ll] of Object.entries(ref.points || {})) place(ll, n === "Municipalidad" ? "Municipalidad de Vicente López" : n, "#6a46b8");
  if (ref.puente) place(ref.puente, "Puente Saavedra", "#b3322d");
  if (ref.cementerio?.[0]) { const c = ref.cementerio[0]; place(c[Math.floor(c.length / 2)], "Cementerio de Olivos", "#4fa35a"); }
  MARKERS = L.layerGroup().addTo(MAP);
  $("#mapcap").innerHTML = `<span><i style="background:#c9a227;height:4px"></i>Maipú</span><span><i style="background:#b3322d"></i>Mitre</span><span><i style="background:#2e7fa8"></i>Belgrano N.</span><span><i style="background:#6b6578;height:5px"></i>Panamericana / Gral. Paz</span><span><i style="background:#4fa35a"></i>Plazas</span><span><i style="background:#b3322d;opacity:.4"></i>Villa Borges (no)</span><span>Círculos: puntaje (verde 62+, ámbar 50–61, rojo &lt;50)</span>`;
}
function renderMap() {
  if (!window.L) { $("#lmap").innerHTML = `<div class="empty">El mapa necesita conexión a internet.</div>`; return; }
  initMap();
  MARKERS.clearLayers();
  const pts = rows().filter(l => l.lat);
  for (const l of pts) {
    const b = band(l.score, l);
    L.marker([l.lat, l.lng], { icon: L.divIcon({ className: "", html: `<div class="pin ${b}${l.id === sel ? " on" : ""}">${l.discard.length ? "" : Math.round(l.score)}</div>`, iconSize: b === "out" ? [12, 12] : [28, 28], iconAnchor: b === "out" ? [6, 6] : [14, 14] }),
      zIndexOffset: l.id === sel ? 1000 : b === "hi" ? 500 : 0 })
      .addTo(MARKERS).bindTooltip(`${usd(l.price_usd)} · ${esc(l.address)}`).on("click", e => { e.target.closeTooltip(); select(l.id); });
  }
  setTimeout(() => {
    MAP.invalidateSize();
    if (!MAP._fitted && pts.length) { MAP.fitBounds(pts.map(l => [l.lat, l.lng]), { padding: [24, 24], maxZoom: 16 }); MAP._fitted = true; }
  }, 50);
}

/* ── filters sheet ── */
function fbtnLabel() { const n = nFilt(); $("#fbtn").innerHTML = `Filtros${n ? `<span class="n">${n}</span>` : ""}`; $("#fbtn").setAttribute("aria-pressed", n > 0); }
function rngText(k) {
  const [, , , , f] = RANGES.find(r => r[0] === k), [a, b] = BOUNDS[k], v = FILT.r[k];
  if (!v) return "Cualquiera";
  if (v[0] <= a) return `hasta ${f(v[1])}`;
  if (v[1] >= b) return `${f(v[0])} o más`;
  return `${f(v[0])} – ${f(v[1])}`;
}
function paintRange(el) {
  const k = el.dataset.k, [a, b] = BOUNDS[k], [lo, hi] = FILT.r[k] || [a, b];
  const fill = el.querySelector(".fill");
  fill.style.left = (100 * (lo - a) / (b - a)) + "%"; fill.style.right = (100 - 100 * (hi - a) / (b - a)) + "%"; fill.style.opacity = FILT.r[k] ? 1 : .3;
  const t = el.querySelector(".top b"); t.textContent = rngText(k); t.classList.toggle("any", !FILT.r[k]);
}
function filtCount() { const n = rows().length; $("#fapply").textContent = n === 1 ? "Ver 1 casa" : `Ver ${n} casas`; }
let filtFrame = 0;
function filtChanged() {
  store.set("hh-filters", FILT); fbtnLabel();
  cancelAnimationFrame(filtFrame);
  filtFrame = requestAnimationFrame(() => { shown = PAGE; renderList(); filtCount(); });
}
function renderFilters() {
  const ranges = RANGES.map(([k, label, , step]) => {
    const [a, b] = BOUNDS[k], [lo, hi] = FILT.r[k] || [a, b];
    return `<div class="rng" data-k="${k}"><div class="top"><span class="label">${label}</span><b></b></div>
      <div class="dual"><div class="track"></div><div class="fill"></div>
        <input type="range" min="${a}" max="${b}" step="${step}" value="${lo}" data-end="0" aria-label="${label}: mínimo">
        <input type="range" min="${a}" max="${b}" step="${step}" value="${hi}" data-end="1" aria-label="${label}: máximo"></div></div>`;
  }).join("");
  const chips = CHOICES.map(([g, label, opts]) => `<div><span class="label">${label}</span><div class="choices" data-g="${g}">${opts.map(([v, t]) =>
    `<button type="button" data-v="${esc(v)}" aria-pressed="${!!FILT.c[g]?.includes(v)}">${t}</button>`).join("")}</div></div>`).join("");
  const f = $("#filters");
  f.innerHTML = `<div class="shead"><h2>Filtros</h2><button class="btn" id="freset">Limpiar</button><button class="icon" id="fclose" aria-label="Cerrar filtros">✕</button></div>
    <div class="sbody">${chips}${ranges}</div>
    <div class="sfoot"><button class="btn primary" id="fapply"></button></div>`;
  f.querySelectorAll(".rng").forEach(paintRange);
  f.oninput = e => {
    const inp = e.target.closest(".dual input"); if (!inp) return;
    const el = inp.closest(".rng"), k = el.dataset.k, [a, b] = BOUNDS[k], [i0, i1] = el.querySelectorAll("input");
    let lo = +i0.value, hi = +i1.value;
    if (lo > hi) { if (inp === i0) hi = lo; else lo = hi; i0.value = lo; i1.value = hi; }
    // the thumb that was moved last stays on top, so two thumbs at the same spot can still be pulled apart
    i0.style.zIndex = inp === i0 ? 2 : 1; i1.style.zIndex = inp === i1 ? 2 : 1;
    if (lo <= a && hi >= b) delete FILT.r[k]; else FILT.r[k] = [lo, hi];
    paintRange(el); filtChanged();
  };
  f.onclick = e => {
    const c = e.target.closest(".choices button");
    if (c) {
      const g = c.parentElement.dataset.g, v = c.dataset.v, cur = FILT.c[g] || [];
      FILT.c[g] = g === "patio" ? (cur.includes(v) ? [] : [v]) : cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v];
      c.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", FILT.c[g].includes(b.dataset.v)));
      filtChanged(); return;
    }
    if (e.target.closest("#freset")) { FILT = { r: {}, c: {} }; renderFilters(); filtChanged(); return; }
    if (e.target.closest("#fapply, #fclose")) closeLayer("filters");
  };
  filtCount();
}
function openFilters() {
  renderFilters();
  $("#filters").hidden = $("#fscrim").hidden = false;
  document.body.classList.add("locked");
  openLayer("filters", () => { $("#filters").hidden = $("#fscrim").hidden = true; unlock(); window.scrollTo({ top: 0 }); });
}

/* ── address search on the map (OpenStreetMap Nominatim, free) ── */
let HERE = null;
function toM(p, o) { return [(p[1] - o[1]) * 111320 * Math.cos(o[0] * Math.PI / 180), (p[0] - o[0]) * 110540]; }
function distLine(p, ways) {   // metres from p to the nearest point of a set of polylines
  let best = Infinity;
  for (const w of ways || []) for (let i = 1; i < w.length; i++) {
    const [ax, ay] = toM(w[i - 1], p), [bx, by] = toM(w[i], p), dx = bx - ax, dy = by - ay;
    const t = Math.max(0, Math.min(1, -(ax * dx + ay * dy) / ((dx * dx + dy * dy) || 1)));
    best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
  }
  return best;
}
async function findAddress(q) {
  const box = $("#mres");
  if (!q) return;
  box.hidden = false; box.innerHTML = `<button type="button" disabled>Buscando…</button>`;
  const url = "https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=ar&accept-language=es&q=";
  try {
    let res = await fetch(url + encodeURIComponent(q) + "&viewbox=-58.56,-34.47,-58.44,-34.57&bounded=1").then(r => r.json());
    if (!res.length) res = await fetch(url + encodeURIComponent(q + ", Vicente López, Buenos Aires")).then(r => r.json());
    if (!res.length) { box.innerHTML = `<button type="button" disabled>No encontré esa dirección. Probá "calle número, barrio".</button>`; return; }
    if (res.length === 1) { box.hidden = true; return showHere(res[0]); }
    box.innerHTML = res.map((r, i) => `<button type="button" data-i="${i}">${esc(r.display_name.split(",").slice(0, 3).join(","))}</button>`).join("");
    box.onclick = e => { const b = e.target.closest("[data-i]"); if (b) { box.hidden = true; showHere(res[+b.dataset.i]); } };
  } catch (e) { box.innerHTML = `<button type="button" disabled>No pude buscar (${esc(e.message)}).</button>`; }
}
// cleared search: drop the pin and go back to the view of all the houses
function clearHere() {
  $("#mres").hidden = true;
  if (!MAP) return;
  if (HERE) { HERE.remove(); HERE = null; }
  MAP.closePopup();
  const pts = rows().filter(l => l.lat);
  if (pts.length) MAP.fitBounds(pts.map(l => [l.lat, l.lng]), { padding: [24, 24], maxZoom: 16 });
}
function showHere(r) {
  initMap();
  const p = [+r.lat, +r.lon], ref = DATA.reference || {};
  const maipu = distLine(p, ref.maipu) / 100;
  const st = Object.entries(ref.stations || {}).map(([n, s]) => [n, Math.hypot(...toM(s, p)) / 100]).sort((a, b) => a[1] - b[1])[0];
  const near = rows().filter(l => l.lat && Math.hypot(...toM([l.lat, l.lng], p)) < 500).length;
  if (HERE) HERE.remove();
  HERE = L.marker(p, { icon: L.divIcon({ className: "", html: `<div class="pin here"></div>`, iconSize: [18, 18], iconAnchor: [9, 9] }), zIndexOffset: 2000 }).addTo(MAP)
    .bindPopup(`<b>${esc(r.display_name.split(",").slice(0, 2).join(","))}</b><br>${blk(maipu)} cdas de Maipú${st ? ` · Est. ${esc(st[0])} a ${blk(st[1])} cdas` : ""}<br>${near} casa${near === 1 ? "" : "s"} de la lista a menos de 5 cuadras`).openPopup();
  MAP.setView(p, 16);
}

    <div><span class="label">Fuentes</span><div class="status" style="margin-top:6px">${Object.entries(DATA.status || {}).map(([k, s]) =>
      `<span class="pill ${s.ok ? "ok" : "err"}" title="${esc(s.error || "")}">${SRC[k] || k}: ${s.ok ? s.count + " · " + esc((s.at || "").slice(5)) : "falló " + esc((s.at || "").slice(5))}</span>`).join("")}</div></div>
    <div><span class="label">Cómo puntúa el algoritmo (sobre 100)</span>
      <div class="wbar">${Object.entries(DATA.weights).map(([k, w]) => `<i style="flex:${w};background:${COLORS[k]}"></i>`).join("")}</div>
      <div class="wlegend">${Object.entries(DATA.weights).map(([k, w]) => `<span><i style="background:${COLORS[k]}"></i>${LABELS[k]} ${w}</span>`).join("")}</div>
      <p style="margin-top:8px">Para las mejores candidatas, la IA lee fotos, datos, tus preferencias y tus notas, y su puntaje reemplaza al del algoritmo.</p></div>
    <div class="section"><span class="label">Percentiles</span>
      <p>${pctMode === "now" ? `Recalculados con las ${DATA.pct_n_now} casas puntuadas hasta hoy.` : "Cada percentil se calculó contra todas las casas puntuadas hasta ese momento."}</p>
      <div class="row2"><button class="btn" id="pctbtn">Recalcular con todos los datos</button>${pctMode === "now" ? `<button class="btn" id="pctback">Volver a los originales</button>` : ""}</div></div>
    <div class="section"><span class="label">Alertas al celular</span>
      <p>Te llega una notificación por cada casa nueva que cumpla al menos una de estas dos condiciones.</p>
      <div class="row2"><label>Percentil ≥ <input id="apct" type="number" min="0" max="100" inputmode="numeric" value="${SETTINGS.alert_percentile}" style="width:5em;flex:none"></label>
        <label>o puntaje IA ≥ <input id="aai" type="number" min="0" max="100" inputmode="numeric" value="${SETTINGS.alert_ai_score}" style="width:5em;flex:none"></label>
        ${tok ? `<button class="btn" id="asave">Guardar</button>` : ""}</div>
      ${tok ? "" : "<p>Para cambiarlas desde acá, conectá GitHub abajo.</p>"}</div>
    <div class="section"><span class="label">Tus preferencias (la IA las lee)</span>
      <textarea class="prefs" id="prefs" ${tok ? "" : "readonly"}>${esc(PREFS)}</textarea>
      ${tok ? `<div class="row2"><button class="btn primary" id="prefsave">Guardar preferencias</button></div>` : `<p>Para editarlas desde acá, conectá GitHub abajo.</p>`}</div>
    <div class="section"><span class="label">Sincronizar entre dispositivos</span>
      <p>Tus marcas y notas se guardan en este dispositivo. Para tenerlas en el celu y la compu, para que la IA lea tus notas y para pedirle evaluaciones con el botón ✨, pegá un token de GitHub con permiso de escritura en <b>${REPO}</b> (Settings → Developer settings → Fine-grained tokens → Contents: Read and write).</p>
      <div class="row2"><input id="tok" type="password" autocomplete="off" placeholder="github_pat_…" value="${tok ? "••••••••" : ""}"><button class="btn" id="toksave">${tok ? "Cambiar" : "Conectar"}</button>${tok ? `<button class="btn" id="tokdel">Desconectar</button>` : ""}</div>
      <span class="saved" id="syncstate">${esc(syncState)}</span></div>`;
  $("#pctbtn").onclick = () => { recalcPct(); renderInfo(); renderList(); if (sel) renderDetail(DATA.listings.find(x => x.id === sel)); };
  if ($("#pctback")) $("#pctback").onclick = () => { pctMode = "saved"; renderInfo(); renderList(); if (sel) renderDetail(DATA.listings.find(x => x.id === sel)); };
  if ($("#asave")) $("#asave").onclick = async () => {
    SETTINGS = { ...SETTINGS, alert_percentile: +$("#apct").value, alert_ai_score: +$("#aai").value };

    catch (e) { setSync("No pude guardar: " + e.message); }

  if ($("#tokdel")) $("#tokdel").onclick = () => { store.set("hh-token", ""); setSync(""); renderInfo(); };

}

function boot(d) {
  DATA = d;
  calcBounds(); fbtnLabel();
  renderInfo(); renderList();
  loadShared();
  $("#tabs").onclick = e => { const b = e.target.closest("button"); if (!b) return;
    view = b.dataset.v; shown = PAGE; document.querySelectorAll("#tabs button").forEach(x => x.setAttribute("aria-selected", x === b));
    b.scrollIntoView({ block: "nearest", inline: "nearest" });
    renderList(); window.scrollTo({ top: 0 }); };
  $("#sort").onchange = () => { shown = PAGE; renderList(); };
  $("#q").oninput = () => { shown = PAGE; renderList(); };
  $("#list").onclick = e => {
    const c = e.target.closest(".card"); if (!c) return;
    const b = e.target.closest("[data-act]");
    if (b) { e.stopPropagation(); if (b.dataset.act !== "link") act(DATA.listings.find(x => x.id === c.dataset.id), b.dataset.act); return; }
    select(c.dataset.id);
  };
  $("#list").onkeydown = e => { const c = e.target.closest(".card"); if (c && e.key === "Enter") select(c.dataset.id); };
  const toggle = (btn, el, after) => $(btn).onclick = () => { const on = el.hidden; el.hidden = !on; $(btn).setAttribute("aria-pressed", on); if (on && after) after(); };
  toggle("#mapbtn", $("#map"), renderMap);
  toggle("#infobtn", $("#info"));
  wide.addEventListener?.("change", () => { const i = layers.findIndex(x => x.name === "detail"); if (i >= 0) layers.splice(i, 1);
    closeDetail(); renderList(); if (wide.matches && sel) renderDetail(DATA.listings.find(x => x.id === sel)); });
  $("#fbtn").onclick = openFilters;
  $("#fscrim").onclick = () => closeLayer("filters");
  $("#msearch").onsubmit = e => { e.preventDefault(); findAddress($("#maddr").value.trim()); };
  $("#maddr").oninput = () => { if (!$("#maddr").value.trim()) clearHere(); };
}

const inline = $("#hh-data").textContent.trim();
if (inline && !inline.startsWith("__")) boot(JSON.parse(inline));
else fetch("listings.json").then(r => r.json()).then(boot).catch(() => { $("#list").innerHTML = `<div class="empty">No pude cargar listings.json.</div>`; });
</script>
